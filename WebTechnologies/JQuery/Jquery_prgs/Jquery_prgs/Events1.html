    //eg for mouse events
    $(document).ready(function () {
        $('p').on({
            mouseenter: function () {
                $(this).css("background-color", "green");
            },
            mouseleave: function () {
                $(this).css("background-color", "red");
            },
            dblclick: function () {
                $(this).css("color", "blue").css("background-color", "beige").css("fontSize", "48px");
            },
        });
    });
</script>
