<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-3.4.1.min.js"></script>
<style>
     #board {
        padding: 7px;
        font-size: 20px;
        background-color:chocolate;
        border: 1px solid blue;
        text-align: center;
    }

    
</style>
    <script>
        $(document).ready(function () {
            $('#c1').click(function () {
                $('div').slideDown(5000);
            });
            $('#c2').click(function () {
                $('div').stop();
            })
        })
    </script>
</head>
<body>
    <h2> Slide and Stop</h2>
    <button id="c2">Stop Sliding</button>
    <br/>
    <button id="c1">Start Sliding</button>

    <div id="board">
        <p> This is to slide and stop</p>
    </div>

</body>
</html>
