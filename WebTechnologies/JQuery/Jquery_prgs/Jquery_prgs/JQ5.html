<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <srcipt src="https://code.jquery.com/jquery-4.0.0.js"></srcipt>
    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-3.4.1.min.js"></script>
    <style>
        div{
            background-color:firebrick;
            margin:3px;
            width:80px;
            height:40px;
            display:none;
            float:left;
        }
    </style>
</head>
<body>
    click me!
    <div></div>
    <div></div>
    <div></div>
    <script>
        $(document.body).on( "click", function () {
            if ($('div').first().is(":hidden")) {
                $('div').slideDown("slow");
            } else {
                $('div').hide();
            }
        });
    </script>
</body>
</html>
