    <script>
        $(document).ready(function () {
            $(".hide").click(function () {
                $(this).parents(".ex").hide();
            });
        });
    </script>

        div.ex{
            background-color:aqua;
            padding:7px;
            border:solid 1px red;
        }
    </style>

    <p>Para 1</p>

    <h3>Head 3</h3>
