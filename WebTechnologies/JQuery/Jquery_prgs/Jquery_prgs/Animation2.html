<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
   <srcipt src="https://code.jquery.com/jquery-4.0.0.js"></srcipt>
<script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-3.4.1.min.js"></script>
    <style>
        div{
            background:#cfd;
            margin:3px;
            width:50px;
            text-align:center;
            float:left;
            cursor:pointer;
            border:2px outset black;
            font-weight:bolder;
        }
        input{
            display:none;
            width:120px;
            float:left;
            margin:10px;
        }
    </style>    
</head>
<body>
    <div>Push !</div>
    <input type="text" />
    <input type="text" class="middle" />
    <input type="text" />

    <script>
        $("div").on("click", function () {
            $(this).css({
                borderStyle: "inset",
                cursor: "wait"
            });
            $("input").slideDown(1000, function () {
                $(this)
                    .css("border", "2px red inset")
                    .filter(".middle")
                    .css("background", "yellow")
                    .trigger("focus");
                $("div").css("visibility", "hidden");
            });
        });
    </script>
</body>
</html>
