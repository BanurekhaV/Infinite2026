<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>NavBar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" />

    <style>
        .navbar-nav .nav-link{
            color:#fff;
        }
        .dropend .dropdown-toggle{
            color:salmon;
            margin-left:1em;
        }
        .dropdown-item:hover{
            background-color:lime;
            color:#fff;
        }
        .dropdown .dropdown-menu{
            display:none;
        }
        .dropdown:hover > .dropdown-menu,
        .dropend:hover > .dropdown-menu{
            display:block;
            margin-top:0.125em;
            margin-left:0.125em;
        }
        @media screen and (min-width:769px){
            .dropend:hover > .dropdown-menu{
                position: absolute;
                top:0;
                left:100%;
            }
            .dropend .dropdown-toggle{
                margin-left:0.5em;
            }
        }
    </style>
    </head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:salmon;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Infinite Solutions Ltd</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#"
                    aria-expanded="false" aria-label="Togglenavigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse">
                <ul class=" navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Documents</a>
                    
                     <ul class="dropdown-menu">
                         <li><a href="#" class="dropdown-item">Doc 1.1</a></li>
                         <li><a class="dropdown-item" href="#">Doc 1.2</a></li>
                         <li>
                             <hr class="dropdown-divider" />
                         </li>
                         <li class="nav-item dropend">
                             <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Documents</a>
                             <ul class="dropdown-menu">
                                 <li><a href="#" class="dropdown-item">Doc 2.1</a></li>
                                 <li><a class="dropdown-item" href="#">Doc 2.2</a></li>
                                 <li>
                                     <hr class="dropdown-divider" />
                                 </li>
                                 <li><a class="dropdown-item" href="#">Some More Options..</a></li>
                              </ul>
                         </li>
                     </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <footer>
        &copy; 2026 Infinite Assoiciates - Bootstrap Project P-12. All rights reserved
    </footer>
</body>
</html>
