<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>-->
    
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>
<body>

    <h3>Default Progress Bar</h3>
    <div class="progress">
        <div class="progress-bar" style="width:60%">
        </div>
    </div>

    <h3>Creating Progress Bar with Label</h3>
    <div class="progress">
        <div class="progress-bar" style="width:60%">
            60%
        </div>
    </div>
    <p class="lead">For percentage label you should also add a min-width to ensure label text is readable</p>
    <div class="progress">
        <div class="progress-bar" style="min-width: 20px; width: 2%;">
            2%
        </div>
    </div>

    <h3>Alternate Progress Bar</h3>
    <div class="progress">
        <div class="progress-bar progress-bar-success" style="width:60%">
            60%
        </div>
    </div>

    <div class="progress">
        <div class="progress-bar progress-bar-info" style="width:50%">
            50%
        </div>
    </div>

    <div class="progress">
        <div class="progress-bar progress-bar-danger" style="width:40%">
            40%
        </div>
    </div>

    <div class="progress">
        <div class="progress-bar progress-bar-warning" style="width:30%">
            30%
        </div>
    </div>

    <h3>Striped Progress Bar</h3>
    <div class="progress progress-striped">
        <div class="progress-bar progress-bar-danger" style="width:50%">
        </div>
    </div>

    <h3>Animated Progress Bar</h3>
    <div class="progress progress-striped active">
        <div class="progress-bar progress-bar-success" style="width:50%">
        </div>
    </div>

    <h3>Stacked Progress Bar</h3>
    <div class="progress">
        <div class="progress-bar progress-bar-success" style="width:50%"></div>
        <div class="progress-bar progress-bar-danger" style="width:20%"></div>
        <div class="progress-bar progress-bar-warning" style="width:30%">
        </div>
    </div>
        <h3>Changing Progress Bar Value Dynamically</h3>
        
        <div class="progress progress-striped active">
            <div class="progress-bar"></div>
        </div>

        <!-- jQuery Script -->
        <script type="text/javascript">
            var i = 0;
            function makeProgress() {
                if (i < 100) {
                    i = i + 1;
                    $(".progress-bar").css("width", i + "%").text(i + " %");
                }
                // Wait for sometime before running this script again
                setTimeout("makeProgress()", 100);
            }
            makeProgress();
        </script>
</body>
</html>
