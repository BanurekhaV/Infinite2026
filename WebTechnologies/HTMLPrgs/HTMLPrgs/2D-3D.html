    <!--Example 2-->
    <style>
        div.a{
            width:150px;
            height:80px;
            background-color:olive;
            transform:rotate(20deg);
        }
        div.b {
            width: 150px;
            height: 80px;
            background-color: orange;
            transform:skewX(20deg);
        }

        div.c {
            width: 150px;
            height: 80px;
            background-color: lawngreen;
            transform:scaleY(1.5);
        }
    </style>
    </head>
<body>
    <h1>Transformation Properties of CSS 3</h1>
    <br/>
    <h2>Rotate</h2>
    <div class="a">I am a Rotating DIV</div>
    <hr/>
    <div class="b">I am a Skewed Div</div>
    <hr/>
    <div class="c">I am a Scaling Div</div>
</body>
