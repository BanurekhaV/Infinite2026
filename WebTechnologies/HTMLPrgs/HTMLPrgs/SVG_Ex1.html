<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=decive-width, initial-scale=0" />
    <title>SVG</title>
</head>
<body>
    <!--svg ex 1-->
    <svg width="100" height="100">
        <circle cx="50"
                cy="50"
                r="40"
                fill="red"></circle>
    </svg>
    <!--svg ex 2-->
    <hr />
    <svg viewBox="0,0,50,50">
        <rect width="10" height="10" fill="green">
            <animate attributeName="rx" values="0;20;0"
                     dur="5s" repeatCount="10" />
        </rect>
    </svg>
    <!--svg ex 3-->
    <hr />
    <h2>SVG Element Animate</h2>
    <svg viewBox="0,0,50,50">
        <rect width="7" height="9" fill="crimson">
            <animate attributeName="opacity" attributeType="CSS" 
                     from="1" to="0"
                     dur="4s" repeatCount="indefinite" />
            </rect>
        </svg>

    <!--ex 4-->
    <svg width="120" height="120">
        <polygon points="60,30 90,90 30,90">
            <animateTransform attributeName="transform"
                              attributeType="XML" type="rotate"
                              from="0 60 70" to="360 60 70"
                              dur="10s" repeatCount="indefinite"></animateTransform>
        </polygon>
    </svg>
</body>
</html>
