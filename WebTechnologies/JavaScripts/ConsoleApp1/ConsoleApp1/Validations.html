<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <script>
        function FormValidator() {
            //let us make references to all the form fields
            var firstname = document.getElementById('fname');
            var addr = document.getElementById('addr');
            var zip = document.getElementById('zip');
            var state = document.getElementById('state');
            var username = document.getElementById('username');
            var email = document.getElementById('email');

            //check the user input in the same order
            if (isAlphabet(firstname, "Please enter only characters for Name..")) {
                if (isAlphaNumeric(addr, "Address can have only characters and numbers")) {
                    if (isNumeric(zip, "Please enter a valid 6 digit number")) {
                        if (madeSelection(state, "Please choose a state from the list")) {
                            if (lengthRestriction(username, 6, 12)) {
                                if (emailValidate(email, "Please eneter email in correct format")) {
                                    return true;
                                }
                            }
                        }
                    }
                }
            }
            return false;
        }

        //let us now write individual functions

       function isAlphabet(elem, helpmsg) {
            var alphaexpr = /^[a-z][A-Z]+$/;
            if (elem.value.match(alphaexpr)) {
                return true;
            } else {
                alert(helpmsg);
                elem.focus()
                return false;
            }
        }

        function isAlphaNumeric(elem, helpmsg) {
            var alphanum = /^[a-z][A-Z][0-9]+$/;
            if (elem.value.match(alphanum)) {
                return true;
            } else {
                alert(helpmsg);
                elem.focus();
                return false;
            }
        }

        function isNumeric(elem, helpmsg) {
            var numericexpr = /^[0-9]+$/;
            if (elem.value.match(numericexpr)) {
                return true;
            } else {
                alert(helpmsg);
                elem.focus();
                return false;
            }
        }

        function madeSelection(elem, helpmsg) {
            if (elem.value == "Choose State") {
                alert(helpmsg);
                elem.focus();
                return false;
            } else {
                return true;
                   }
        }

        function lengthRestriction(elem, min, max) {
            var uname = elem.value;
            if (uname.length >= min && uname.length <= max) {
                return true;
            } else {
                alert("User name to be between  " + min + " and " + max + " characters only");
                elem.focus();
                return false;
            }
        }

        function emailValidate(elem, helpmsg) {
            var emailexpr = /^[\w\-\.\+]+\@[a-zA-Z0-9\.\-]+\.[a-zA-Z0-9]{2,4}$/;
            if (elem.value.match(emailexpr)) {
                return true;
            } else {
                alert(helpmsg);
                elem.focus();
                return false;
            }
        }
    </script>
    <h1 style="color:orangered;font-weight:bolder"> Registration Form</h1>
    <form onsubmit="FormValidator()">
        First Name            : <input type="text" id="fname" /><br /><br />
        Address               : <input type="text" id="addr" /><br /><br />
        Zip Code              : <input type="text" id="zip" /><br /><br />
        State                 : <select id="state">
            <option>Choose State</option>
            <option>Andhra Pradesh</option>
            <option>Karnataka</option>
            <option>Tamil Nadu</option>
        </select> <br /><br />
        User Name             : <input type="text" id="username" /><br /><br />
        Email                 : <input type="text" id="email" /><br /><br />

        <input type="submit" value="Validate Form" />

    </form>
</body>
</html>
