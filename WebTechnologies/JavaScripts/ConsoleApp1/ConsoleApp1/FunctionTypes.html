<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <script>
        //1. Function declaration
        console.log(add(10, 20));

        function add(x, y) {
            console.log(x + y);
        }

        add(5, 6);

        //2. function expression

        const addnum = function (x, y) {
            console.log(x + y);
        }

        addnum(5, 5);
        console.log(addnum);
        console.log(addnum(12, 15));

        //3. arrow functions with single line
        let addfunc = (x, y) => x + y;
        console.log(addfunc(10, 12));

        //b multiline
        const check = (x, y) => {
            if (x > y)
                return 'x is greater';
            else
            return 'y is greater'
        }

        console.log(check(6, 8));

        //function with return type

        function func_ret(x, y) {
            let sum = x + y;
            return sum;
        }

        console.log(func_ret(2, 3));

        var num = prompt("Enter a Number");
        if (num > 10)
            console.log('Entered number is grater than 10');
        else
            console.log("number less than 10");

        //javascript methods - when a property of an object contains a function
        let employee = {
            empname: "Surekha",
            dept: "IT",
            details: function () {
                return this.empname + " works for the department " + this.dept;
            }
        };
        console.log(employee.details());

         </script>
</body>
</html>
