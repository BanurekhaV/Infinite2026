<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>

    <script>
        function doLoop() {
            var repeat = document.getElementById('saythis').value;
            var maxloop = document.getElementById('howmany').value;
            var str = '';

            for (var i = 1; (i <= maxloop); i++) {
                str = str + i + ': ' + repeat + '<br/>';
            }
            document.getElementById('results').innerHTML = str;
        }
    </script>
</head>
<body>
    <h2>Welcome to Loops</h2>
    <p> Repeat What ?? </p> &nbsp;&nbsp;<input id="saythis" size="20" />
    <br />
    <p>How many Times ?</p>&nbsp;&nbsp;<select id="howmany">
    <option value="1">1 Time</option>
    <option value="5">5 Times</option>
    <option value="10">10 Times</option>
    <option value="15">15 Times</option>
</select>
    <br/>
    <button onclick="doLoop()">Do It </button>
    <br/>
    <div id="results"></div>

    <hr/>
    <!--while loop-->
    <script>
        var count = 0;
        document.write("Starting the Loop...");
        while (count < 10) {
            document.write("<b><i> Current Count : " + count + "</i></b><br/>");
            count++;
        }
        document.write("looping Done..")
    </script>
    <hr/>
    <!-- if else-->
    <script>
        var subject = "English";
        if (subject == "Science") {
            document.write("<b>Science</b>")
        }
        else if (subject == "Maths") {
            document.write("<b>Maths</b>")
        }
        else if (subject == "English") {
            document.write("<b>It is English</b>")
        }
        else
            document.write("Unknown subject");

    </script>
    <hr/>
    <!-- switch example-->
    <script>
        var grade = 'A';
        switch (grade) {
            case 'A': document.write("<b><i> A Grade </i></b>");
                break;
            case 'B': document.write("<b><i> B Grade </i></b>");
                break;
            default: document.write("<b><i> Invalid Grade </i></b>");
                break;
        }
    </script>
</body>
</html>
