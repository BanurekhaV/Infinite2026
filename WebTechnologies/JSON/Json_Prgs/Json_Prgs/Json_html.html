<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <h1>JSON.parse() creates Java Script Objects</h1>
    <p id="demo"></p>
    <br/>
    <hr />
    <h2>JSON.stringify() creates strings</h2>
    <p id="demo1"></p>

    <script>
        //1. parsing text to objects
        const mydata = '{"name":"Infinite Ltd.", "city":"Bangalore", "age":25}';

        const myobj = JSON.parse(mydata);
        document.getElementById('demo').innerHTML = "Parsed Object Details = " +
            "Company Name : " + myobj.name + " " + "Head Office :" +  myobj.city + " " + "Years : " + myobj.age; 

        //2. stringigy objects to text
        data = JSON.stringify(myobj);
        document.write("Stringified Data is : " + data);

        //3. replacers with stringify
        var robj = { "customername": "banurekha", "City": "Chennai", "age": 30 };
        var rtext = JSON.stringify(robj, function (k, v) {
            if (k == "customername") {
                return v.toUpperCase();
            } else if (k == "age") {
                return v + 5;
            } else {
                return v;
            }
        });
        console.log(rtext);
        document.getElementById('demo1').innerHTML = rtext;
    </script>
</body>
</html>
